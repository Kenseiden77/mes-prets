<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Prêts - Test Simple</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-6">

  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow space-y-4">
    <h1 class="text-xl font-bold text-center">📦 Mes Prêts (v1.0.3)</h1>

    <!-- FORMULAIRE DE CONNEXION -->
    <div id="box-login" class="space-y-3">
      <div>
        <label class="block text-sm font-medium">Email</label>
        <input type="email" id="txt-email" class="w-full p-2 border rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Mot de passe</label>
        <input type="password" id="txt-pass" class="w-full p-2 border rounded">
      </div>
      <button id="btn-login" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">
        Se connecter
      </button>
      <div id="login-status" class="text-xs text-red-500 font-semibold text-center"></div>
    </div>

    <!-- ZONE PRÊTS (Cachée au départ) -->
    <div id="box-app" class="hidden space-y-4">
      <div class="p-3 bg-emerald-100 text-emerald-800 rounded text-sm font-semibold text-center">
        ✅ Connecté !
      </div>

      <div class="border-t pt-3 space-y-2">
        <h2 class="font-bold">Ajouter un prêt</h2>
        <input type="text" id="loan-obj" placeholder="Objet (ex: Perceuse)" class="w-full p-2 border rounded">
        <input type="text" id="loan-who" placeholder="À qui ? (ex: Julien)" class="w-full p-2 border rounded">
        <button id="btn-add" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">
          Enregistrer le prêt
        </button>
      </div>

      <div class="border-t pt-3 space-y-2">
        <h2 class="font-bold">Liste des prêts</h2>
        <div id="loans-container" class="space-y-2 text-sm"></div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://oascemhvoyroxtthwwkn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hc2NlbWh2b3lyb3h0dGh3d2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjczMzYsImV4cCI6MjEwNzkwMzMzNn0.WPi_ErafVvZGD3Ubn2JTU5WSP_TldKXraXsSq0Ra8Vg";

    let supabaseClient = null;

    // Attendre le chargement complet de la page
    window.onload = function() {
      // Initialiser Supabase
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Associer le clic sur Se Connecter
      document.getElementById('btn-login').onclick = handleLogin;
      document.getElementById('btn-add').onclick = handleAddLoan;
    };

    async function handleLogin() {
      const email = document.getElementById('txt-email').value;
      const password = document.getElementById('txt-pass').value;
      const statusDiv = document.getElementById('login-status');

      statusDiv.innerText = "Tentative de connexion...";

      if (!email || !password) {
        statusDiv.innerText = "Veuillez entrer un email et un mot de passe.";
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        statusDiv.innerText = "Erreur : " + error.message;
      } else {
        statusDiv.innerText = "";
        document.getElementById('box-login').classList.add('hidden');
        document.getElementById('box-app').classList.remove('hidden');
        loadLoansList();
      }
    }

    async function handleAddLoan() {
      const obj = document.getElementById('loan-obj').value;
      const who = document.getElementById('loan-who').value;

      if (!obj || !who) {
        alert("Remplissez l'objet et le prénom.");
        return;
      }

      const today = new Date().toISOString().split('T')[0];

      const { error } = await supabaseClient
        .from('prets')
        .insert([{ object_name: obj, borrower: who, date: today, returned: false }]);

      if (error) {
        alert("Erreur ajout : " + error.message);
      } else {
        document.getElementById('loan-obj').value = '';
        document.getElementById('loan-who').value = '';
        loadLoansList();
      }
    }

    async function loadLoansList() {
      const container = document.getElementById('loans-container');
      container.innerHTML = "Chargement...";

      const { data, error } = await supabaseClient
        .from('prets')
        .select('*');

      if (error) {
        container.innerHTML = "Erreur : " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = "<p class='text-gray-500'>Aucun prêt enregistré.</p>";
        return;
      }

      container.innerHTML = data.map(loan => `
        <div class="p-2 border rounded flex justify-between items-center ${loan.returned ? 'bg-gray-100 opacity-50' : 'bg-white'}">
          <div>
            <b>${loan.object_name}</b> à ${loan.borrower} (${loan.date})
          </div>
          <button onclick="toggleReturnedItem(${loan.id}, ${!loan.returned})" class="text-xs bg-slate-200 px-2 py-1 rounded">
            ${loan.returned ? 'Rendu' : 'Marquer rendu'}
          </button>
        </div>
      `).join('');
    }

    async function toggleReturnedItem(id, status) {
      await supabaseClient.from('prets').update({ returned: status }).eq('id', id);
      loadLoansList();
    }
  </script>
</body>
</html>
