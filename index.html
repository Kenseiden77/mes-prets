<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Prêts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Client Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">

  <div class="max-w-2xl mx-auto space-y-6">

    <!-- En-tête -->
    <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-xl font-bold text-indigo-600">📦 Mes Prêts</h1>
      <button id="logout-btn" onclick="logout()" class="hidden text-sm bg-slate-200 px-3 py-1.5 rounded-lg hover:bg-slate-300">
        Déconnexion
      </button>
    </header>

    <!-- SECTION 1 : Authentification (Connexion / Inscription / Réinitialisation) -->
    <div id="auth-section" class="bg-white rounded-xl shadow-md p-6">
      
      <!-- Connexion / Inscription -->
      <div id="login-box">
        <h2 id="auth-title" class="text-2xl font-bold mb-4 text-center">Connexion</h2>
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium">Adresse Email</label>
            <input type="email" id="email" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium">Mot de passe</label>
            <input type="password" id="password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">
            Se connecter
          </button>
        </form>

        <div class="mt-4 pt-4 border-t flex flex-col gap-2 text-center text-sm">
          <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-indigo-600 hover:underline">
            Pas encore de compte ? S'inscrire
          </button>
          <button onclick="showResetPassword()" class="text-slate-500 hover:underline text-xs">
            Mot de passe oublié ?
          </button>
        </div>
      </div>

      <!-- Mot de passe oublié -->
      <div id="reset-box" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-center">Réinitialiser le mot de passe</h2>
        <p class="text-sm text-slate-600">Saisissez votre email pour recevoir un lien de réinitialisation.</p>
        <form onsubmit="handleResetPassword(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium">Adresse Email</label>
            <input type="email" id="reset-email" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">
            Envoyer le lien
          </button>
        </form>
        <button onclick="showLogin()" class="w-full text-sm text-slate-500 hover:underline text-center">
          Retour à la connexion
        </button>
      </div>

      <!-- Saisie du nouveau mot de passe -->
      <div id="update-password-box" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-center">Nouveau mot de passe</h2>
        <form onsubmit="handleUpdatePassword(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium">Nouveau mot de passe</label>
            <input type="password" id="new-password" required minlength="6" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700">
            Mettre à jour le mot de passe
          </button>
        </form>
      </div>

    </div>

    <!-- SECTION 2 : Dashboard Principal -->
    <div id="app-section" class="hidden space-y-6">

      <!-- Formulaire d'ajout de prêt -->
      <div class="bg-white rounded-xl shadow-md p-6">
        <h2 class="text-lg font-bold mb-4">Nouveau prêt</h2>
        <form onsubmit="addLoan(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <input type="text" id="obj-name" placeholder="Objet (ex: Perceuse)" required class="p-2 border rounded-lg">
          <input type="text" id="borrower" placeholder="À qui ? (ex: Thomas)" required class="p-2 border rounded-lg">
          <input type="date" id="loan-date" required class="p-2 border rounded-lg">
          <button type="submit" class="sm:col-span-3 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">
            Enregistrer le prêt
          </button>
        </form>
      </div>

      <!-- Liste des prêts -->
      <div class="bg-white rounded-xl shadow-md p-6">
        <h2 class="text-lg font-bold mb-4">Mes prêts enregistrés</h2>
        <div id="loans-list" class="space-y-3">
          <!-- Les prêts enregistrés s'affichent ici -->
        </div>
      </div>

    </div>

  </div>

  <script>
    // Configuration Supabase
    const SUPABASE_URL = "https://oascemhvoyroxtthwwkn.supabase.co";
    
    // ⚠️ Mettez ici la clé qui commence par "eyJ..." (anon public)
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hc2NlbWh2b3lyb3h0dGh3d2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjczMzYsImV4cCI6MjEwNzkwMzMzNn0.WPi_ErafVvZGD3Ubn2JTU5WSP_TldKXraXsSq0Ra8Vg";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let isSignUpMode = false;

    // Initialisation
    window.addEventListener('DOMContentLoaded', () => {
      // Écouter les changements d'état d'authentification
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          document.getElementById('auth-section').classList.remove('hidden');
          document.getElementById('app-section').classList.add('hidden');
          document.getElementById('login-box').classList.add('hidden');
          document.getElementById('reset-box').classList.add('hidden');
          document.getElementById('update-password-box').classList.remove('hidden');
        } else if (session) {
          showDashboard();
          loadLoans();
        } else {
          showAuthScreen();
        }
      });
    });

    // Connexion / Inscription
    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (isSignUpMode) {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) alert("Erreur d'inscription : " + error.message);
        else alert("Compte créé ! Un email de confirmation vous a été envoyé.");
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert("Erreur de connexion : " + error.message);
      }
    }

    // Demande de réinitialisation de mot de passe
    async function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const redirectTo = window.location.href;

      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) {
        alert("Erreur : " + error.message);
      } else {
        alert("Un email contenant le lien de réinitialisation vous a été envoyé !");
        showLogin();
      }
    }

    // Mise à jour du mot de passe
    async function handleUpdatePassword(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;

      const { error } = await supabase.auth.updateUser({ password: newPassword });
      if (error) {
        alert("Erreur lors de la mise à jour : " + error.message);
      } else {
        alert("Mot de passe mis à jour avec succès !");
        document.getElementById('update-password-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
      }
    }

    // Charger les prêts depuis la base
    async function loadLoans() {
      const { data: loans, error } = await supabase
        .from('prets')
        .select('*')
        .order('date', { ascending: false });

      if (error) {
        console.error("Erreur de chargement :", error);
        return;
      }

      const listContainer = document.getElementById('loans-list');
      if (loans.length === 0) {
        listContainer.innerHTML = `<p class="text-slate-500 text-center py-4">Aucun prêt enregistré.</p>`;
        return;
      }

      listContainer.innerHTML = loans.map(loan => `
        <div class="flex items-center justify-between p-3 border rounded-lg ${loan.returned ? 'bg-slate-50 opacity-60' : 'bg-white'}">
          <div>
            <div class="font-bold ${loan.returned ? 'line-through text-slate-500' : ''}">${escapeHtml(loan.object_name)}</div>
            <div class="text-xs text-slate-500">Prêté à <b>${escapeHtml(loan.borrower)}</b> le ${loan.date}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleReturned(${loan.id}, ${!loan.returned})" 
              class="text-xs px-3 py-1.5 rounded-lg text-white font-medium ${loan.returned ? 'bg-slate-500 hover:bg-slate-600' : 'bg-emerald-600 hover:bg-emerald-700'}">
              ${loan.returned ? 'Marquer à rendre' : 'Marquer rendu'}
            </button>
            <button onclick="deleteLoan(${loan.id})" class="text-xs text-red-500 hover:text-red-700 p-1">
              🗑️
            </button>
          </div>
        </div>
      `).join('');
    }

    // Ajouter un nouveau prêt
    async function addLoan(e) {
      e.preventDefault();
      const object_name = document.getElementById('obj-name').value;
      const borrower = document.getElementById('borrower').value;
      const date = document.getElementById('loan-date').value;

      const { error } = await supabase.from('prets').insert([{ object_name, borrower, date }]);
      if (error) {
        alert("Erreur lors de l'ajout : " + error.message);
      } else {
        document.getElementById('obj-name').value = '';
        document.getElementById('borrower').value = '';
        loadLoans();
      }
    }

    // Modifier l'état rendu / en cours
    async function toggleReturned(id, newStatus) {
      const { error } = await supabase.from('prets').update({ returned: newStatus }).eq('id', id);
      if (!error) loadLoans();
    }

    // Supprimer un prêt
    async function deleteLoan(id) {
      if (confirm("Supprimer ce prêt ?")) {
        const { error } = await supabase.from('prets').delete().eq('id', id);
        if (!error) loadLoans();
      }
    }

    // Déconnexion
    async function logout() {
      await supabase.auth.signOut();
    }

    // Fonctions d'affichage
    function showAuthScreen() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('logout-btn').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
    }

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').innerText = isSignUpMode ? "Inscription" : "Connexion";
      document.getElementById('auth-submit-btn').innerText = isSignUpMode ? "S'inscrire" : "Se connecter";
      document.getElementById('toggle-auth-btn').innerText = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    }

    function showResetPassword() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('reset-box').classList.remove('hidden');
    }

    function showLogin() {
      document.getElementById('reset-box').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
    }
  </script>
</body>
</html>
